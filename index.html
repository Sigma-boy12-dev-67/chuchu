<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocuWrite</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--brand:#3b5b9d;--brand2:#6a8be0;--p:var(--brand);--t:#1f2430;--mut:#6b7385;--b:#e3e7ef;--card:#fff;--bg:#f4f6fb;--canvas:#e6eaf4;--glass:rgba(255,255,255,.82);--sh:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.08);--r:14px}
@media(prefers-color-scheme:dark){:root{--brand:#8fa9f5;--brand2:#b4c6ff;--t:#e6e9f2;--mut:#98a1b8;--b:#2d3446;--card:#1b2030;--bg:#121623;--canvas:#0c0f19;--glass:rgba(24,29,44,.84);--sh:0 1px 2px #0006,0 8px 28px #0007}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#9aa4bd66 transparent}
::selection{background:rgba(106,139,224,.35)}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--t);background:radial-gradient(1100px 560px at 8% -10%,rgba(106,139,224,.22),transparent),radial-gradient(900px 480px at 100% 0,rgba(150,110,230,.14),transparent),var(--bg) fixed;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:var(--t)}.hide{display:none!important}.sp{flex:1}
button{background:none;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s}
button:hover{background:rgba(128,136,170,.18)}button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.btn,#aGo{background:linear-gradient(135deg,#3b5b9d,#6a8be0)!important;color:#fff!important;padding:9px 18px;border-radius:999px;font-weight:600;box-shadow:0 4px 14px rgba(59,91,157,.38)}
.btn:hover{box-shadow:0 6px 20px rgba(59,91,157,.5);transform:translateY(-1px)}
input,select,textarea{background:var(--card);border:1px solid var(--b);border-radius:9px;padding:8px 11px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(106,139,224,.25)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo img{width:34px;height:34px;-webkit-text-fill-color:initial}
header{display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:10}
#auth{max-width:400px;margin:9vh auto;background:var(--glass);backdrop-filter:blur(18px);padding:38px 34px;border-radius:24px;display:flex;flex-direction:column;gap:13px;border:1px solid var(--b);box-shadow:0 30px 80px rgba(30,45,100,.22)}
#auth .logo{justify-content:center;font-size:26px;margin-bottom:4px}#auth .logo img{width:52px;height:52px}
#authTitle{text-align:center;font-size:20px;font-weight:600;margin-bottom:6px}#auth input{padding:12px 14px}
#aSwitch,#aGuest{color:var(--mut)}#aSwitch:hover,#aGuest:hover{color:var(--brand)}
#search{width:340px;max-width:40vw;border-radius:999px;padding:9px 18px;background:var(--bg)}
#who{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b5b9d,#8a6ae0);color:#fff;display:grid;place-items:center;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:8px 28px 80px}
.hero h1{font-size:32px;letter-spacing:-.03em;margin:34px 0 4px}.hero p{margin:0;color:var(--mut);font-size:15px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:36px 0 16px}
.grid{display:flex;flex-wrap:wrap;gap:20px}.empty{color:var(--mut);padding:24px;border:2px dashed var(--b);border-radius:var(--r);width:100%;text-align:center}
.card{width:180px;background:var(--card);border:1px solid var(--b);border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;font-size:11px;color:var(--mut);box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.card:hover{transform:translateY(-5px);border-color:var(--brand2);box-shadow:0 16px 36px rgba(40,60,130,.22)}
.card b{padding:2px 14px 0;font-size:13.5px;color:var(--t);word-break:break-word}.card>span{padding:3px 14px 13px;display:flex;justify-content:space-between;align-items:center}
.pv{height:156px;margin:12px 12px 10px;background:#fff;border:1px solid var(--b);border-radius:6px;padding:13px;overflow:hidden;box-shadow:0 2px 8px rgba(20,30,60,.08)}
.pv i{display:block;height:5px;border-radius:3px;background:#dfe4f0;margin-bottom:9px}.pv i:nth-child(1){width:55%;height:8px;background:var(--brand2)}.pv i:nth-child(2){width:100%}.pv i:nth-child(3){width:78%}.pv i:nth-child(4){width:92%}.pv i:nth-child(5){width:60%}
.pv.txt{font-size:7px;line-height:1.5;color:#3a4152;word-break:break-word}
.card button{padding:2px 6px;opacity:0;transition:opacity .15s}.card:hover button{opacity:1}
#editor,#pdf{display:flex;flex-direction:column;height:100vh}
#bar{background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--b);position:relative;z-index:15}
#top{display:flex;align-items:center;gap:8px;padding:8px 16px 4px}#back{padding:2px 6px}
#title{border:1px solid transparent;background:none;font-size:17px;font-weight:600;width:280px;padding:6px 10px}#title:hover{border-color:var(--b)}
#menus{display:flex;gap:2px}.mi{position:relative}.mi>button{font-weight:500;padding:5px 11px}
.dd{position:absolute;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--b);box-shadow:0 14px 40px rgba(20,30,60,.25);min-width:210px;z-index:20;border-radius:14px;padding:6px;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.dd button{display:block;width:100%;text-align:left;border-radius:9px;padding:8px 12px}
.dd small{opacity:.65;font-weight:400;white-space:normal;display:block;font-size:11.5px;margin-top:1px}
#dlwrap .dd{right:0;left:auto;width:350px;max-height:72vh;overflow:auto}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:4px 14px 10px;padding:5px 8px;background:var(--card);border:1px solid var(--b);border-radius:14px;box-shadow:var(--sh)}
#tools button,.clr{min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:0 7px}
#tools button.on{background:rgba(106,139,224,.22);color:var(--brand);font-weight:700}
#tools select,#tools input{height:30px;padding:2px 8px;border-radius:8px;width:auto}#tools #size{width:54px}
.sep{width:1px;height:20px;background:var(--b);margin:0 5px}
.clr{position:relative;cursor:pointer;font-weight:700;transition:background .15s}.clr:hover{background:rgba(128,136,170,.18)}
.clr input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0}
.clr i{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;background:#000}
#scroll{flex:1;overflow:auto;padding:30px 0 70px;background:var(--canvas)}
#page{width:794px;max-width:96%;min-height:1050px;margin:0 auto;background:#fff;color:#000;padding:72px 80px;border-radius:3px;box-shadow:0 1px 3px rgba(20,30,60,.14),0 18px 50px rgba(20,30,60,.16);outline:0;font:12pt/1.5 Arial,sans-serif;transform-origin:top center}
#page table{border-collapse:collapse}#page td{border:1px solid #999;padding:6px;min-width:60px}#page img{max-width:100%}
#status{padding:6px 20px;font-size:12px;color:var(--mut);background:var(--glass);border-top:1px solid var(--b)}
#ai{position:fixed;right:18px;top:150px;width:320px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--b);border-radius:18px;padding:16px;z-index:30;box-shadow:0 24px 60px rgba(20,30,60,.35);display:flex;flex-direction:column;gap:10px;animation:pop .16s ease}
#ai textarea{height:110px;resize:vertical}#aiOut{white-space:pre-wrap;max-height:170px;overflow:auto;padding:10px;background:var(--bg);border-radius:10px}#aiOut:empty{display:none}
#pdfpages{background:var(--canvas);height:auto!important;flex:1;overflow:auto;padding:16px 0}#pdfpages canvas{display:block;margin:14px auto;border-radius:3px;box-shadow:0 1px 3px rgba(20,30,60,.14),0 14px 40px rgba(20,30,60,.16);max-width:96%}
.fnt .pv{font-size:12px;line-height:1.3;color:#1f2430;display:flex;flex-direction:column;justify-content:center}.fnt .aa{font-size:52px;line-height:1.1;margin-bottom:8px;color:var(--brand)}.up{border-style:dashed}.up .pv{display:grid;place-items:center;font-size:40px;color:var(--brand);box-shadow:none;background:transparent;border-style:dashed}
.tpl .pv,.doc .pv{height:214px;padding:0;position:relative}
.thumb{position:absolute;left:0;top:0;width:794px;padding:64px 72px;font:16px/1.5 Arial,sans-serif;color:#000;background:#fff;transform:scale(.194);transform-origin:0 0;pointer-events:none;user-select:none}
.thumb table{border-collapse:collapse}.thumb td{border:1px solid #bbb;padding:6px}.thumb img{max-width:100%}
.pv.plus{display:grid;place-items:center;font-size:58px;color:var(--brand);background:#fff}
@media(max-width:720px){#title{width:140px}header{padding:10px 14px}.wrap{padding:8px 14px 60px}.hero h1{font-size:24px}}
@media print{body *{visibility:hidden}#page,#page *{visibility:visible}#page{position:absolute;left:0;top:0;box-shadow:none;width:100%}}
</style></head><body>

<div id="auth" class="hide">
 <div class="logo"><img src="favicon-512.png" alt=""><span>DocuWrite</span></div>
 <div id="authTitle">Sign in</div>
 <input id="aName" placeholder="Name" class="hide"><input id="aEmail" type="email" placeholder="Email"><input id="aPass" type="password" placeholder="Password">
 <button class="btn" id="aGo">Sign in</button>
 <button id="aSwitch">Create an account</button><button id="aGuest">Continue as guest</button>
 <small id="aErr" style="color:#d93025"></small>
</div>

<div id="home" class="hide">
 <header><span class="logo"><img src="favicon-512.png" alt=""><span>DocuWrite</span></span><input id="search" placeholder="Search documents" style="width:260px"><span class="sp"></span>
  <button id="openPdf">📕 Open PDF</button><span id="who"></span><button id="out">Sign out</button></header>
 <div class="wrap"><div class="hero"><h1 id="hi">Welcome back</h1><p>Create something new or pick up where you left off.</p></div><h3>Start a new document</h3><div class="grid" id="tpls"></div>
 <h3>Your documents</h3><div class="grid" id="docs"></div>
 <h3>Your fonts</h3><div class="grid" id="fonts"></div></div>
</div>

<div id="editor" class="hide">
 <div id="bar">
  <div id="top"><button id="back" title="Home"><img src="favicon-512.png" alt="Home" style="width:28px;height:28px;display:block"></button><input id="title" value="Untitled document"><div id="menus"></div><span class="sp"></span><span id="saved" style="font-size:12px"></span><div class="mi" id="dlwrap"><button class="btn">⬇ Download</button><div class="dd hide" id="dlList"></div></div> <button id="aiBtn">✨ AI</button></div>
  <div id="tools">
   <button data-c="undo" title="Undo">↶</button><button data-c="redo" title="Redo">↷</button><button onclick="print()" title="Print">🖨</button><span class="sep"></span>
   <select id="blk"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Code</option></select>
   <select id="font"><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Courier New</option><option>Trebuchet MS</option><option>Comic Sans MS</option><optgroup label="Uploaded fonts" id="upFonts"></optgroup></select><button id="upFont" title="Upload a font file">＋Font</button>
   <button id="sm" title="Decrease font size">−</button><input id="size" list="sizes" value="12" title="Font size (pt)" style="width:54px;text-align:center"><button id="sp" title="Increase font size">+</button><datalist id="sizes"><option value="8"><option value="9"><option value="10"><option value="11"><option value="12"><option value="14"><option value="16"><option value="18"><option value="20"><option value="24"><option value="28"><option value="32"><option value="36"><option value="48"><option value="72"></datalist><span class="sep"></span>
   <button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><button data-c="strikeThrough"><s>S</s></button>
   <label class="clr" title="Text colour">A<i id="fi"></i><input type="color" id="fc" value="#000000"></label>
   <label class="clr" title="Highlight colour">🖍<i id="hi" style="background:#ffff00"></i><input type="color" id="hc" value="#ffff00"></label><span class="sep"></span>
   <button data-c="justifyLeft">⬅</button><button data-c="justifyCenter">↔</button><button data-c="justifyRight">➡</button><button data-c="justifyFull">☰</button><span class="sep"></span>
   <button data-c="insertUnorderedList">• List</button><button data-c="insertOrderedList">1. List</button><button data-c="outdent">⇤</button><button data-c="indent">⇥</button><span class="sep"></span>
   <button data-c="superscript">x²</button><button data-c="subscript">x₂</button><button id="lnk">🔗</button><button id="img">🖼</button><button id="tbl">▦</button><button data-c="removeFormat" title="Clear formatting">Tx</button>
  </div>
 </div>
 <div id="scroll"><div id="page" contenteditable="true" spellcheck="true"></div></div>
 <div id="status"></div>
 <div id="ai" class="hide"><b>✨ AI assistant (Groq)</b>
  <textarea id="aiP" placeholder="Select text, then type an instruction (or use a button)…"></textarea>
  <div><button data-ai="Improve the writing of this text.">Improve</button><button data-ai="Fix spelling and grammar.">Fix grammar</button><button data-ai="Summarize this text.">Summarize</button><button data-ai="Continue writing this text.">Continue</button></div>
  <button class="btn" id="aiGo">Run</button><div id="aiOut" style="white-space:pre-wrap;max-height:160px;overflow:auto"></div><button id="aiIns" class="hide">Insert result</button></div>
</div>

<div id="pdf" class="hide">
 <header><button id="pdfBack">← Home</button><b id="pdfName"></b><span class="sp"></span><button id="zo">−</button><span id="zl">100%</span><button id="zi">+</button></header>
 <div id="pdfpages" style="height:calc(100vh - 54px);overflow:auto"></div>
</div>
<input type="file" id="pdfIn" accept="application/pdf" class="hide"><input type="file" id="fontIn" accept=".ttf,.otf,.woff,.woff2,font/*" multiple class="hide"><input type="file" id="imgIn" accept="image/*" class="hide">

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let user=LS('dw_session'),cur=null,range=null,mode='in',zoom=1,pdfDoc=null,pdfScale=1.2,aiText='';
const page=$('#page'),show=v=>['auth','home','editor','pdf'].forEach(x=>$('#'+x).classList.toggle('hide',x!=v));
const key=()=>'dw_docs_'+user.email,docs=()=>LS(key())||[];

/* ---------- Auth (browser-local demo; swap for Netlify Identity/Supabase for real accounts) ---------- */
$('#aSwitch').onclick=()=>{mode=mode=='in'?'up':'in';$('#aName').classList.toggle('hide',mode=='in');$('#authTitle').textContent=$('#aGo').textContent=mode=='in'?'Sign in':'Sign up';$('#aSwitch').textContent=mode=='in'?'Create an account':'I have an account'};
$('#aGo').onclick=async()=>{const e=$('#aEmail').value.trim().toLowerCase(),p=$('#aPass').value,u=LS('dw_users')||{};
 if(!e||p.length<4)return $('#aErr').textContent='Enter an email and a password (4+ characters).';
 const h=await sha(p);
 if(mode=='up'){if(u[e])return $('#aErr').textContent='Account exists.';u[e]={name:$('#aName').value||e,h};LS('dw_users',u)}
 else if(!u[e]||u[e].h!=h)return $('#aErr').textContent='Wrong email or password.';
 login({email:e,name:u[e].name})};
$('#aGuest').onclick=()=>login({email:'guest',name:'Guest'});
function login(u){user=u;LS('dw_session',u);route()}
$('#out').onclick=()=>{localStorage.removeItem('dw_session');user=null;show('auth')};

/* ---------- Templates & Home ---------- */
const A='#3b5b9d',H=(t,c=A)=>`<h2 style="color:${c};font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #d9deea;padding-bottom:3px;margin:20px 0 8px">${t}</h2>`,
TH=(...c)=>`<tr>${c.map(x=>`<td style="background:${A};color:#fff"><b>${x}</b></td>`).join('')}</tr>`;
const T={Blank:'<p><br></p>',
Resume:`<h1 style="font-size:34px;color:${A};margin:0">Your Name</h1><p style="margin:2px 0 12px;color:#555">Job Title &nbsp;·&nbsp; email@example.com &nbsp;·&nbsp; +00 000 000 0000 &nbsp;·&nbsp; City</p><hr style="border:0;border-top:3px solid ${A};margin:0 0 4px">${H('Summary')}<p>Two or three sentences about your experience, strengths and what you are looking for.</p>${H('Experience')}<p style="margin:0"><b>Job Title</b> — Company <span style="color:#777">· 2022 – Present</span></p><ul><li>Key achievement with a measurable result</li><li>Responsibility or project you led</li></ul><p style="margin:0"><b>Job Title</b> — Company <span style="color:#777">· 2019 – 2022</span></p><ul><li>Key achievement with a measurable result</li></ul>${H('Education')}<p style="margin:0"><b>Degree</b> — University <span style="color:#777">· 2015 – 2019</span></p>${H('Skills')}<p>Skill one &nbsp;·&nbsp; Skill two &nbsp;·&nbsp; Skill three &nbsp;·&nbsp; Skill four</p>`,
Letter:`<div style="height:8px;background:#1f9d82;margin-bottom:28px"></div><p style="margin:0"><b style="font-size:20px;color:#1f9d82">Your Name</b><br>123 Street Name, City<br>email@example.com</p><p style="margin:28px 0 0">Date</p><p style="margin:20px 0 0">Recipient Name<br>Company<br>Address</p><p style="margin:24px 0 12px"><b>Subject: </b>What this letter is about</p><p>Dear Recipient,</p><p>Opening paragraph: say why you are writing.</p><p>Middle paragraph: give the details, reasons or background.</p><p>Closing paragraph: say what you would like to happen next and thank them.</p><p style="margin-top:24px">Sincerely,<br><br><b>Your Name</b></p>`,
'Project proposal':`<div style="background:linear-gradient(135deg,#3b5b9d,#6a8be0);color:#fff;padding:40px 32px;border-radius:8px;margin-bottom:22px"><div style="font-size:12px;letter-spacing:.25em">PROJECT PROPOSAL</div><h1 style="margin:8px 0 6px;font-size:36px;color:#fff">Project Name</h1><p style="margin:0;color:#dfe7ff">Prepared for Client Name · Date</p></div>${H('Overview')}<p>Describe the project and the problem it solves.</p>${H('Goals')}<ul><li>Goal one</li><li>Goal two</li><li>Goal three</li></ul>${H('Timeline')}<table style="width:100%">${TH('Phase','Dates','Owner')}<tr><td>Research</td><td>Week 1–2</td><td>Name</td></tr><tr><td>Build</td><td>Week 3–6</td><td>Name</td></tr></table>${H('Budget')}<p>Estimated cost and what it covers.</p>`,

/* Reads the page into a simple list of blocks: paragraphs, list items, tables, rules */
function model(){

 const runsOf=el=>{const r=[];const go=n=>{
  if(n.nodeType==3){const t=n.nodeValue.replace(/\u00a0/g,' ').replace(/\u200b/g,'');if(!t)return;const p=n.parentElement,c=getComputedStyle(p);let bg;
   for(let q=p;q&&q!==page;q=q.parentElement){const b=getComputedStyle(q).backgroundColor;if(b&&b!='rgba(0, 0, 0, 0)'&&b!='transparent'){bg=hex(b);break}}
   if(bg=='ffffff')bg=null;
   r.push({t,b:+c.fontWeight>=600||c.fontWeight=='bold',i:c.fontStyle=='italic',u:dec(p,'underline'),s:dec(p,'line-through'),c:hex(c.color),bg,sz:Math.round(parseFloat(c.fontSize)*1.5)/2,f:c.fontFamily.split(',')[0].replace(/["']/g,'').trim()})}
  else if(n.nodeName=='BR')r.push({br:1});else if(n.nodeType==1)n.childNodes.forEach(go)};
  el.childNodes.forEach(go);return r};
 const walk=el=>{let buf=[];const flush=()=>{if(buf.some(n=>n.textContent.trim()||n.nodeName=='BR'))m.push({runs:runsOf({childNodes:buf}),al:'left'});buf=[]};
  el.childNodes.forEach(n=>{
   if(n.nodeType==1&&BLK.test(n.nodeName)){flush();const nm=n.nodeName;
    if(nm=='TABLE')m.push({tb:[...n.rows].map(r=>[...r.cells].map(c=>runsOf(c)))});
    else if(nm=='UL'||nm=='OL')[...n.children].forEach((l,k)=>m.push({runs:runsOf(l),ls:nm,n:k+1,al:'left'}));
    else if(nm=='HR')m.push({hr:1});
    else if([...n.children].some(c=>BLK.test(c.nodeName)))walk(n);
    else m.push({runs:runsOf(n),al:getComputedStyle(n).textAlign});
   }else buf.push(n)});flush()};
 walk(page);return m}

function setSize(v){

  const sp=document.createElement('span');sp.style.fontSize=pt+'pt';sp.textContent='\u200b';
  sel.getRangeAt(0).insertNode(sp);const r=document.createRange();r.setStart(sp.firstChild,1);r.collapse(true);sel.removeAllRanges();sel.addRange(r);
 }else{
  document.execCommand('styleWithCSS',false,false);document.execCommand('fontSize',false,'7');
  const spans=[...page.querySelectorAll('font[size="7"]')].map(f=>{const sp=document.createElement('span');sp.style.fontSize=pt+'pt';while(f.firstChild)sp.appendChild(f.firstChild);f.replaceWith(sp);
   sp.querySelectorAll('[style*="font-size"]').forEach(e=>e.style.fontSize='');return sp});
  if(spans.length){const r=document.createRange();r.setStartBefore(spans[0]);r.setEndAfter(spans[spans.length-1]);sel.removeAllRanges();sel.addRange(r)}
 }
 $('#size').value=pt;range=getSelection().getRangeAt(0).cloneRange();page.oninput()}
$('#size').onchange=e=>setSize(e.target.value);
$('#sm').onclick=()=>setSize((parseFloat($('#size').value)||12)-1);
$('#sp').onclick=()=>setSize((parseFloat($('#size').value)||12)+1);
[$('#sm'),$('#sp'),$('#upFont')].forEach(b=>b.onmousedown=e=>e.preventDefault());
document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount||!page.contains(s.anchorNode))return;
 const el=s.anchorNode.nodeType==3?s.anchorNode.parentElement:s.anchorNode,c=getComputedStyle(el);
 if(document.activeElement!==$('#size'))$('#size').value=Math.round(parseFloat(c.fontSize)*.75*2)/2;
 const fam=c.fontFamily.split(',')[0].replace(/["']/g,'').trim();if(document.activeElement!==$('#font')&&[...$('#font').options].some(o=>o.value==fam))$('#font').value=fam});

/* ---------- Upload fonts (.ttf .otf .woff .woff2), kept in this browser ---------- */
const userFonts={},faces={};
const fdb=()=>new Promise((ok,no)=>{const r=indexedDB.open('dw_fonts',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'name'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const fx=async(mode,fn)=>{const d=await fdb();return new Promise((ok,no)=>{const t=d.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
async function addFont(name,url,persist){
 const ff=new FontFace(name,`url(${url})`);await ff.load();document.fonts.add(ff);faces[name]=ff;userFonts[name]=url;
 if(![...$('#font').options].some(o=>o.value==name)){const o=new Option(name,name);o.style.fontFamily=`"${name}"`;$('#upFonts').appendChild(o)}
 if(persist)await fx('readwrite',s=>s.put({name,url}));renderFonts()}
$('#upFont').onclick=()=>$('#fontIn').click();
$('#fontIn').onchange=async e=>{
 for(const f of e.target.files){const name=f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').trim();
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
  try{await addFont(name,url,true);if(!$('#editor').classList.contains('hide')){cmd('fontName',name);$('#font').value=name}}catch(err){alert(f.name+' is not a valid font file.')}}
 e.target.value=''};
async function removeFont(){const n=Object.keys(userFonts);if(!n.length)return alert('No uploaded fonts yet.');
 const name=prompt('Type the name of the font to remove:\n\n'+n.join('\n'));if(!name||!userFonts[name])return;
 await delFont(name)}
async function delFont(name){await fx('readwrite',s=>s.delete(name));document.fonts.delete(faces[name]);[...$('#font').options].forEach(o=>{if(o.value==name)o.remove()});delete userFonts[name];delete faces[name];renderFonts()}
function renderFonts(){
 $('#fonts').innerHTML='<div class="card up" id="upCard"><div class="pv">＋</div><b>Upload a font</b><span>.ttf .otf .woff .woff2</span></div>'+
 Object.keys(userFonts).map(k=>`<div class="card fnt"><div class="pv" style="font-family:&quot;${esc(k)}&quot;"><div class="aa">Aa</div>The quick brown fox jumps over the lazy dog</div><b>${esc(k)}</b><span>Uploaded font<button data-fd="${esc(k)}" title="Remove font">🗑</button></span></div>`).join('');
 $('#upCard').onclick=()=>$('#fontIn').click();
 $$('[data-fd]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm('Remove the font "'+b.dataset.fd+'"?'))delFont(b.dataset.fd)})}
(async()=>{try{for(const f of await fx('readonly',s=>s.getAll()))await addFont(f.name,f.url,false)}catch(e){}})();

const snip=h=>esc((new DOMParser().parseFromString(h,'text/html').body.textContent||'').trim().slice(0,170));
document.addEventListener('selectionchange',()=>{$$('#tools [data-c]').forEach(b=>{try{b.classList.toggle('on',document.queryCommandState(b.dataset.c))}catch(e){}})});
/* ---------- Menus ---------- */
const sp=(l,f)=>[l,f],M={
File:[sp('New document',()=>{save();newDoc()}),sp('Open PDF…',()=>$('#pdfIn').click()),sp('Download as…',()=>setTimeout(()=>$('#dlwrap>button').click(),0)),sp('Print / Save as PDF',()=>print()),sp('Back to home',()=>{save();home()})],
Edit:[sp('Undo',()=>cmd('undo')),sp('Redo',()=>cmd('redo')),sp('Cut',()=>cmd('cut')),sp('Copy',()=>cmd('copy')),sp('Select all',()=>cmd('selectAll')),sp('Find & replace',findRep)],
Insert:[sp('Image',()=>$('#imgIn').click()),sp('Table',table),sp('Link',()=>$('#lnk').click()),sp('Horizontal line',()=>cmd('insertHorizontalRule')),sp('Checklist',()=>cmd('insertHTML','<ul style="list-style:none"><li>☐ </li></ul>')),sp('Date',()=>cmd('insertText',new Date().toLocaleDateString())),sp('Page break',()=>cmd('insertHTML','<div style="page-break-after:always;border-top:1px dashed #999"></div><p><br></p>'))],
Format:[sp('Bold',()=>cmd('bold')),sp('Italic',()=>cmd('italic')),sp('Underline',()=>cmd('underline')),sp('Strikethrough',()=>cmd('strikeThrough')),sp('Superscript',()=>cmd('superscript')),sp('Subscript',()=>cmd('subscript')),sp('Line spacing 1.0',()=>page.style.lineHeight=1),sp('Line spacing 1.5',()=>page.style.lineHeight=1.5),sp('Line spacing 2.0',()=>page.style.lineHeight=2),sp('Upload font…',()=>$('#fontIn').click()),sp('Remove uploaded font…',removeFont),sp('Clear formatting',()=>cmd('removeFormat'))],
View:[sp('Zoom in',()=>{zoom=Math.min(2,zoom+.1);page.style.zoom=zoom}),sp('Zoom out',()=>{zoom=Math.max(.5,zoom-.1);page.style.zoom=zoom})],
Tools:[sp('AI assistant',()=>$('#ai').classList.toggle('hide')),sp('Word count',()=>alert($('#status').textContent))]};
$('#menus').innerHTML=Object.keys(M).map(k=>`<div class="mi"><button>${k}</button><div class="dd hide">${M[k].map((m,i)=>`<button data-k="${k}" data-i="${i}">${m[0]}</button>`).join('')}</div></div>`).join('');
$$('.mi>button').forEach(b=>b.onclick=e=>{e.stopPropagation();const d=b.nextElementSibling,o=d.classList.contains('hide');$$('.dd').forEach(x=>x.classList.add('hide'));d.classList.toggle('hide',!o)});
$$('.dd button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const L=b.dataset.k=='DL'?DL:M[b.dataset.k];Promise.resolve().then(()=>L[b.dataset.i][1]()).catch(err=>alert('Could not complete this action: '+err.message))}});
document.onclick=()=>$$('.dd').forEach(x=>x.classList.add('hide'));
page.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();save()}});

/* ---------- AI (Groq via Netlify function; key stays server-side) ---------- */
$('#aiBtn').onclick=()=>$('#ai').classList.toggle('hide');
$$('[data-ai]').forEach(b=>b.onclick=()=>{$('#aiP').value=b.dataset.ai;$('#aiGo').click()});
$('#aiGo').onclick=async()=>{const sel=range&&range.toString()||page.innerText;$('#aiOut').textContent='Thinking…';$('#aiIns').classList.add('hide');
 try{const r=await fetch('/.netlify/functions/ai',{method:'POST',body:JSON.stringify({prompt:$('#aiP').value||'Improve this text.',text:sel})});aiText=(await r.json()).text;$('#aiOut').textContent=aiText;$('#aiIns').classList.remove('hide')}
 catch(e){$('#aiOut').textContent='AI unavailable (deploy to Netlify and set GROQ_API_KEY).'}};
$('#aiIns').onclick=()=>cmd('insertText',aiText);

/* ---------- PDF viewer ---------- */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
$('#openPdf').onclick=()=>$('#pdfIn').click();
$('#pdfIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#pdfName').textContent=f.name;show('pdf');pdfDoc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;renderPdf();e.target.value=''};
async function renderPdf(){const box=$('#pdfpages');box.innerHTML='';$('#zl').textContent=Math.round(pdfScale/1.2*100)+'%';
 for(let i=1;i<=pdfDoc.numPages;i++){const p=await pdfDoc.getPage(i),v=p.getViewport({scale:pdfScale}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;box.appendChild(c);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}}
